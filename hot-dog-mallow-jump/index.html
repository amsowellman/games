<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hot Dog Mallow Jump</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="game-title-bar">
            <h1>Hot Dog Mallow Jump</h1>
        </div>
        <canvas id="game" width="420" height="640"></canvas>
        <div id="controls-hint">
            <span class="key">&larr;</span> <span class="key">&rarr;</span> or <span class="key">A</span> <span class="key">D</span> to steer &nbsp;|&nbsp; Tap left / right side on touch
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
